name: Audit

# Supply-chain and vulnerability auditing, kept separate from ci.yml so the fast
# feedback loop stays fast. Secrets and dependency checks run on every push to
# main; image scanning is schedule/dispatch only because it rebuilds both images.
#
# Tools are installed as checksum-verified binaries rather than third-party
# actions. Two reasons: it matches the project's existing --require-hashes and
# SHA-pinned-actions discipline, and gitleaks-action v2 needs a licence key for
# organisation repos while the binary does not.
#
# CodeQL is deliberately NOT here. It is free only on public repositories and
# needs GitHub Advanced Security on private ones. This repo has no remote yet,
# so the condition cannot be evaluated. Enablement step and the resolved pin are
# recorded in docs/ci.md.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Mondays 02:00 UTC
    - cron: "0 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
  TRIVY_VERSION: "0.74.0"
  TRIVY_SHA256: "2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a"

jobs:
  secrets:
    name: Secret scanning
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Full history: a secret committed then removed is still a leak.
          fetch-depth: 0
      - name: Install checksum-verified gitleaks
        run: |
          set -eu
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL "$url" -o gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar xzf gitleaks.tar.gz gitleaks
          install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Scan full history
        run: gitleaks detect --source . --redact --no-banner --exit-code 1
      - name: Assert the gitignored private cache is absent from history
        run: |
          set -eu
          # doc-fetch-resources/ holds non-public source documents and is
          # gitignored. This fails if it ever reached a commit.
          if git log --all --pretty=format: --name-only --diff-filter=A | sort -u | grep -q '^doc-fetch-resources/'; then
            echo "doc-fetch-resources/ is present in git history" >&2
            exit 1
          fi
          echo "doc-fetch-resources/ never committed"

  dependencies:
    name: Dependency vulnerabilities
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.23.2"
      - name: Install checksum-verified trivy
        run: |
          set -eu
          url="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -sSfL "$url" -o trivy.tar.gz
          echo "${TRIVY_SHA256}  trivy.tar.gz" | sha256sum -c -
          tar xzf trivy.tar.gz trivy
          install -m 0755 trivy /usr/local/bin/trivy
          trivy --version
      - name: Audit backend dependencies
        run: |
          set -eu
          python -m pip install uv==0.12.13
          uv audit --project backend --frozen
      - name: Audit frontend dependencies
        run: |
          set -eu
          npm install -g pnpm@11.19.0
          pnpm --dir frontend audit --audit-level=high
      - name: Scan lockfiles and filesystem with trivy
        run: |
          set -eu
          trivy fs --scanners vuln,secret,misconfig \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --skip-dirs frontend/node_modules,artifacts,doc-fetch-resources \
            .

  images:
    name: Container image scan
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    # Rebuilds both images, so it is not worth running on every pull request.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install checksum-verified trivy
        run: |
          set -eu
          url="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -sSfL "$url" -o trivy.tar.gz
          echo "${TRIVY_SHA256}  trivy.tar.gz" | sha256sum -c -
          tar xzf trivy.tar.gz trivy
          install -m 0755 trivy /usr/local/bin/trivy
      - name: Build both images
        run: |
          set -eu
          docker build -t btl-api-audit ./backend
          docker build -t btl-web-audit -f deploy/web.Dockerfile .
      - name: Scan images
        run: |
          set -eu
          for image in btl-api-audit btl-web-audit; do
            trivy image --scanners vuln --severity HIGH,CRITICAL --exit-code 1 "$image"
          done
      - name: Report image size
        run: docker image ls --format 'table {{.Repository}}\t{{.Size}}' btl-api-audit btl-web-audit

  audit:
    name: Audit required
    if: always()
    needs: [secrets, dependencies]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require secret and dependency scanning to pass
        env:
          SECRETS_RESULT: ${{ needs.secrets.result }}
          DEPENDENCIES_RESULT: ${{ needs.dependencies.result }}
        run: |
          test "$SECRETS_RESULT" = success
          test "$DEPENDENCIES_RESULT" = success
