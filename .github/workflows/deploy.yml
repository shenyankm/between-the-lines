name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      action:
        description: Production operation
        type: choice
        options: [deploy, rollback, verify-backup]
        default: deploy

permissions:
  contents: read
  actions: read

concurrency:
  group: btl-production
  cancel-in-progress: false

jobs:
  verify:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.action == 'deploy') ||
      (github.event_name == 'workflow_run' && vars.BTL_AUTO_DEPLOY == 'true' &&
       github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    outputs:
      sha: ${{ steps.gate.outputs.sha }}
      audit_run_id: ${{ steps.gate.outputs.audit_run_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
      - name: Require successful CI and Audit for this exact main commit
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: python3 scripts/verify-release.py

  deploy:
    needs: verify
    runs-on: [self-hosted, linux, x64, btl-production]
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-${{ needs.verify.outputs.sha }}
          run-id: ${{ needs.verify.outputs.audit_run_id }}
          github-token: ${{ github.token }}
          path: ${{ github.workspace }}/release-${{ needs.verify.outputs.sha }}
      - name: Deploy audited immutable images through the root-owned entrypoint
        env:
          RELEASE_SHA: ${{ needs.verify.outputs.sha }}
          AUDIT_RUN_ID: ${{ needs.verify.outputs.audit_run_id }}
        run: sudo -n /usr/local/libexec/btl-deploy deploy --bundle "$GITHUB_WORKSPACE/release-$RELEASE_SHA" --sha "$RELEASE_SHA" --run-id "$AUDIT_RUN_ID"

  maintenance:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.action != 'deploy'
    runs-on: [self-hosted, linux, x64, btl-production]
    timeout-minutes: 15
    steps:
      - name: Run a fixed maintenance operation
        env:
          OPERATION: ${{ inputs.action }}
        run: |
          case "$OPERATION" in
            rollback|verify-backup) sudo -n /usr/local/libexec/btl-deploy "$OPERATION" ;;
            *) exit 1 ;;
          esac
