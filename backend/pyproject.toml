[project]
name = "between-the-lines-api"
version = "0.1.0"
# Narrowed from ">=3.12,<3.14": CI only ever exercised 3.13, so claiming 3.12
# support was an untested promise. See docs/adr/ADR-007.
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.115", "uvicorn[standard]>=0.34", "pydantic-settings>=2.8",
  "sqlalchemy[asyncio]>=2.0", "asyncpg>=0.30", "alembic>=1.15",
  "deepagents>=0.4", "langchain-deepseek>=0.1", "langgraph-checkpoint-postgres>=2.0",
  "psycopg[binary,pool]>=3.2", "authlib>=1.5", "httpx>=0.28", "itsdangerous>=2.2",
  # authlib's OAuth client resolves httpx2 first and treats the plain-httpx
  # fallback as deprecated, but authlib declares neither. Until now httpx2 only
  # reached this environment transitively via deepagents -> anthropic/langsmith,
  # so Zhihu login depended on an edge the agent stack could drop at any time.
  "httpx2>=2.12",
]

[dependency-groups]
dev = [
  "pytest>=9",
  "pytest-asyncio>=0.25",
  "pytest-cov>=6",
  "pytest-randomly>=3",
  "ruff>=0.11",
  "mypy>=1.13",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "unit: pure in-process tests; these pass with PostgreSQL stopped",
  "integration: tests that require a live PostgreSQL and the app lifespan",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Expanded from ["E", "F", "I"]. Additions: B (bugbear: mutable defaults,
# except-then-return, loop-variable binding), UP (pyupgrade to 3.13 idioms),
# SIM (collapsible branches), RUF (unused noqa, mutable class attrs),
# S (bandit: hardcoded secrets, asserts in prod paths, weak hash usage),
# ASYNC (blocking calls inside async def -- directly relevant to the SSE turn
# path), PTH (os.path in favour of pathlib).
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "S", "ASYNC", "PTH"]
ignore = [
  "E501",  # line length is enforced by ruff format, not the linter
  # This is a Chinese-language app: full-width punctuation (，。：""…) inside
  # string literals and docstrings is the correct typography, not a homoglyph
  # attack. RUF001/002/003 flag every one of them, which would bury the 23
  # findings that are actually worth reading.
  "RUF001", "RUF002", "RUF003",
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI resolves Depends() when it builds the route, not when Python evaluates
# the default. The call in the signature is the framework's documented idiom, so
# B008's "function call in default argument" concern does not apply here.
extend-immutable-calls = ["fastapi.Depends"]

[tool.ruff.lint.per-file-ignores]
# Patterns are prefixed with **/ because this config is invoked from the repo
# root (see Makefile lint-py and .github/workflows/ci.yml) against paths outside
# backend/, so a bare "tests/**" would not match.
"**/tests/**" = ["S101", "S105", "S106", "B011"]
"**/migrations/**" = ["E501", "UP"]
# scripts/ holds one-shot developer CLIs (crash-recovery drill, load test,
# contract export). They assert because there is no pytest around them, and they
# spawn and synchronously wait on subprocesses because out-of-process
# orchestration is the entire point. Blocking the event loop of a process that
# has nothing else to do is not a defect. This exemption does not extend to app/.
"**/scripts/**" = ["S101", "S603", "ASYNC220", "ASYNC240"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
show_error_codes = true
pretty = true
files = ["app"]
plugins = ["pydantic.mypy"]

# The agent stack ships without complete type information. These overrides are a
# burn-down list, not a permanent exemption: narrow each entry to specific
# submodules as stubs appear, and never add a new module without a reason.
[[tool.mypy.overrides]]
module = [
  "authlib.*",
  "deepagents.*",
  "langchain_deepseek.*",
  "langchain_core.*",
  "langgraph.*",
  "langgraph_checkpoint.*",
]
ignore_missing_imports = true
follow_untyped_imports = true

[tool.coverage.run]
source = ["app"]
branch = true
omit = ["app/mock_llm.py"]

[tool.coverage.report]
precision = 1
show_missing = true
skip_covered = false
# Floor is what THIS configuration actually measures, less the ratchet headroom
# explained below -- not the true line coverage (84.9). Ratchet it up 2-5% per PR;
# never lower it, and never set an aspirational value that then has to be walked back.
#
# Measured 83.5 when the error contract, logging redaction, metrics, the health
# routes and the config guards gained tests. The floor is set to 82.0 rather than to
# the measurement: that is the top of the band above, and begin_turn's contribution
# moves with any change to the turn path because of the defect below, so a floor
# pinned to the exact figure would fail on an unrelated edit that shifted which of
# its lines the instrument happened to record.
#
# The two numbers differ because of a proven instrument defect, recorded here so
# nobody "fixes" tests that already pass. `branch = true` on Python 3.13 forces
# coverage's settrace cores — sys.monitoring cannot measure branches there — and
# both CTracer and PyTracer drop the synchronous lines of a coroutine that
# suspends repeatedly inside one `async with` block, keeping only the `await`
# lines (CPython re-emits a call event on each resumption, and that is all they
# record). services.py's begin_turn is the only such function in the codebase, so
# it reports 53.6% while three independent checks show every line executing: the
# turn commits and returns 200, a raw sys.settrace probe records lines 36-102,
# and coverage's own sysmon core reports 86.1%. The error is one-directional
# under-measurement, so this floor is conservative rather than unsafe.
#
# Cross-check the true figure with branch coverage off and core=sysmon.
fail_under = 82.0
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "@overload",
]
