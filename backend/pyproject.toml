[project]
name = "between-the-lines-api"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115", "uvicorn[standard]>=0.34", "pydantic-settings>=2.8",
  "sqlalchemy[asyncio]>=2.0", "asyncpg>=0.30", "alembic>=1.15",
  "deepagents>=0.4", "langchain-deepseek>=0.1", "langgraph-checkpoint-postgres>=2.0",
  "psycopg[binary,pool]>=3.2", "authlib>=1.5", "httpx>=0.28", "itsdangerous>=2.2",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.25", "ruff>=0.11"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
