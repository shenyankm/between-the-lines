# Standalone test stack: never reads local .env or mounts development data.
name: btl-ci
services:
  db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: btl
      POSTGRES_PASSWORD: btl
      POSTGRES_DB: btl
    volumes:
      - ci_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U btl -d btl"]
      interval: 2s
      timeout: 3s
      retries: 30
  api:
    build: ./backend
    environment:
      ENVIRONMENT: test
      AGENT_MODE: mock
      DEEPSEEK_API_KEY: ""
      DEV_LOGIN_ENABLED: "true"
      PUBLIC_ORIGIN: http://localhost:18080
      DATABASE_URL: postgresql+asyncpg://btl:btl@db:5432/btl
      CHECKPOINT_URL: postgresql://btl:btl@db:5432/btl
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 20s
  web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    ports:
      - "127.0.0.1:18080:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/api/health"]
      interval: 3s
      timeout: 5s
      retries: 30
volumes:
  ci_pgdata:
