# TLS terminates at the host Caddy. Only the loopback web port is published.
services:
  db:
    restart: unless-stopped
  api:
    image: ${BTL_API_IMAGE:-between-the-lines-api:latest}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/ready', timeout=5)"]
      interval: 15s
      timeout: 6s
      start_period: 60s
      retries: 5
  web:
    image: ${BTL_WEB_IMAGE:-between-the-lines-web:latest}
    ports: !override
      - "127.0.0.1:18080:8080"
    volumes:
      - ./deploy/nginx.server.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
networks:
  default:
    ipam:
      config:
        - subnet: 172.31.219.0/24
