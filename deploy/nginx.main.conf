# The master and workers run as UID/GID 101; no privileged runtime is needed.
worker_processes auto;
pid /tmp/nginx.pid;
# Native error entries can include raw request targets; path-only access logs
# carry upstream failures without exposing OAuth parameters.
error_log /dev/stderr crit;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    log_format path_only '$remote_addr "$request_method $uri $server_protocol" $status $request_time';
    access_log /dev/stdout path_only;
    limit_req_zone $binary_remote_addr zone=guest:1m rate=1r/m;
    sendfile on;
    keepalive_timeout 65;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    include /etc/nginx/conf.d/*.conf;
}
