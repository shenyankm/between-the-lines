server {
    listen 8080;
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $btl_backend api:8000;
    access_log /dev/stdout path_only;
    # Caddy is the only public entry; Docker's host gateway is its direct peer.
    set_real_ip_from 172.31.219.1;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    gzip on;
    gzip_types application/javascript text/css application/json;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 16k;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    location = /api/auth/guest {
        limit_req zone=guest burst=4 nodelay;
        limit_req_status 429;
        proxy_pass http://$btl_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /api/ {
        proxy_pass http://$btl_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 90s;
    }
    # The API serves Prometheus metrics at /metrics, outside the /api/ prefix above,
    # so nothing here proxies it and it currently falls through to the SPA catch-all
    # below. That is an accident of try_files, not a control: it would become public
    # the moment the catch-all narrowed or a proxy rule was added. Deny it on purpose.
    location = /metrics {
        return 404;
    }
    location /assets/ {
        try_files $uri =404;
        expires 7d;
        location ~ \.(webp|js|css)$ { expires 365d; }
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
